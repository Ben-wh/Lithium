<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0d0d10" />
		<script>
			// Apply the saved theme before first paint so there's no flash.
			// Keep in sync with src/lib/theme.svelte.ts.
			(function () {
				var pref;
				try { pref = localStorage.getItem('lithium-theme'); } catch (e) {}
				var light = pref === 'light' || (pref !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
				document.documentElement.dataset.theme = light ? 'light' : 'dark';
				document.querySelector('meta[name="theme-color"]').content = light ? '#f6f6f8' : '#0d0d10';
				// The workspace accent colour, remembered from the last visit (see src/lib/accents.ts).
				var accent;
				try { accent = localStorage.getItem('lithium-accent'); } catch (e) {}
				if (accent && /^[a-z]+$/.test(accent)) document.documentElement.dataset.accent = accent;
			})();
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<title>Lithium</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
